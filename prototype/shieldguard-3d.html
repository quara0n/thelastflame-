/* Layout: one full-height stage with the figure, controls in a bar along the bottom (thumb reach on a phone). */
:root {
  --ash: #15130f;        /* ground of the page, dark ash */
  --ember: #f0a83a;      /* the flame's gold */
  --navy: #22335c;       /* the humans' colour */
  --bone: #ece5d6;       /* text */
  --muted: #a39a89;
  --panel: rgba(21, 19, 15, 0.78);
  --line: rgba(240, 168, 58, 0.35);
  --display: 'Cinzel', 'Times New Roman', serif;
  --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ash); color: var(--bone); font-family: var(--body); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--display); font-size: 26px; letter-spacing: 0.04em; margin: 0; text-wrap: balance; color: var(--bone); }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.tier { display: inline-block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ember); border: 1px solid var(--line); padding: 2px 8px; border-radius: 2px; margin-bottom: 6px; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  background: var(--panel); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
  padding-top: 10px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px;
}
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); min-width: 68px; }
button {
  font: 500 15px var(--body); color: var(--bone); background: transparent;
  border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--ember); color: var(--ash); border-color: var(--ember); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
#msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 1; pointer-events: none; }
#msg[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x15130f);
  scene.fog = new THREE.Fog(0x15130f, 14, 40);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 200);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;

  scene.add(new THREE.HemisphereLight(0xffe3c0, 0x2a2018, 0.55));
  const key = new THREE.DirectionalLight(0xffdcae, 1.6);
  key.position.set(-3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 30 });
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffa84a, 1.1);
  rim.position.set(2, 3, -5);
  scene.add(rim);

  // ash ground with a faint warm glow toward the gate
  const gtex = (function () {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(256, 256, 10, 256, 256, 256);
    grd.addColorStop(0, '#3b3226'); grd.addColorStop(1, '#17140f');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 2500; i++) {
      g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '90,78,62' : '20,17,13') + ',' + (Math.random() * 0.5) + ')';
      g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  })();
  const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ map: gtex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);

  const units = [];   // { root, mixer, actions }
  let clipName = 'idle';
  let view = 'near';
  let proto = null, clips = [];

  function addUnit(x, z, ry) {
    const root = proto.clone(true);
    root.position.set(x, 0, z); root.rotation.y = ry;
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(root);
    const mixer = new THREE.AnimationMixer(root);
    const actions = {};
    clips.forEach(c => { actions[c.name] = mixer.clipAction(c); });
    const u = { root, mixer, actions, phase: Math.random() };
    units.push(u);
    play(u, clipName);
    return u;
  }

  function play(u, name) {
    const once = name === 'attack' || name === 'hit' || name === 'die';
    Object.values(u.actions).forEach(a => a.stop());
    const a = u.actions[name];
    if (!a) return;
    a.reset();
    a.setLoop(once && name === 'die' ? THREE.LoopOnce : THREE.LoopRepeat);
    a.clampWhenFinished = name === 'die';
    a.time = name === 'die' ? 0 : u.phase * a.getClip().duration;
    a.play();
  }

  function setView(v) {
    view = v;
    units.splice(1).forEach(u => scene.remove(u.root));
    if (v === 'near') {
      camera.fov = 35; camera.updateProjectionMatrix();
      camera.position.set(1.9, 1.6, 5.6);
      controls.target.set(0, 0.95, 0);
      controls.minDistance = 1.2; controls.maxDistance = 9;
    } else {
      // roughly the game's own view: high, far, looking toward the portal; a squad of 12
      for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
        if (r === 0 && c === 0) continue;
        addUnit((c - 1.5) * 1.3 + (r % 2) * 0.4, -r * 1.4, 0);
      }
      units[0].root.position.set(-1.5 * 1.3, 0, 0);
      camera.fov = 40; camera.updateProjectionMatrix();
      camera.position.set(0, 14, 16);
      controls.target.set(0, 0.5, -1.4);
      controls.minDistance = 6; controls.maxDistance = 40;
    }
    if (v === 'near') units[0].root.position.set(0, 0, 0);
    controls.update();
  }

  function press(group, btn) {
    document.querySelectorAll('[data-' + group + ']').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  }
  document.querySelectorAll('[data-clip]').forEach(b => b.addEventListener('click', () => {
    clipName = b.dataset.clip; press('clip', b);
    units.forEach(u => play(u, clipName));
  }));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    press('view', b); setView(b.dataset.view);
  }));

  const raw = atob(document.getElementById('glb').textContent.trim());
  const buf = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
  new THREE.GLTFLoader().parse(buf.buffer, '', g => {
    proto = g.scene; clips = g.animations;
    // Blender's soft rounded parts look better with a touch less metal shine at phone size
    proto.traverse(o => { if (o.isMesh && o.material && o.material.metalness > 0.8) o.material.envMapIntensity = 1.2; });
    addUnit(0, 0, 0);
    setView('near');
    msg.hidden = true;
  }, () => { msg.textContent = 'Figuren lot seg ikke laste. Last siden på nytt.'; });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    units.forEach(u => u.mixer.update(dt));
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
